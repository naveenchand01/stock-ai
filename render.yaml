services:
  # 1. Node.js Express Backend Service
  - type: web
    name: stock-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ML_SERVICE_URL
        value: https://stock-ai-ml-service.onrender.com

  # 2. Python Flask ML Service
  - type: web
    name: stock-ai-ml-service
    env: python
    plan: free
    rootDir: backend/ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
