services:
  # 1. Node.js Express Backend Service
  - type: web
    name: stock-ai-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --production=false && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # 2. Python Flask ML Service
  - type: web
    name: stock-ai-ml-service
    env: python
    plan: free
    rootDir: backend/ml_service
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PORT
        value: 5000
